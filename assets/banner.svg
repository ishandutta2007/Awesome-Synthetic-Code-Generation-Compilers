<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16"/>
      <stop offset="50%" stop-color="#0E172B"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#818CF8"/>
      <stop offset="70%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="compilerGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1E293B" stroke-width="0.8" opacity="0.6"/>
      <circle cx="36" cy="36" r="1.2" fill="#38BDF8" opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    .mono-font { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .sans-font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.06); }
    }
    @keyframes dashStream {
      to { stroke-dashoffset: -48; }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .ambient-pulse {
      transform-origin: 940px 200px;
      animation: pulseGlow 7s ease-in-out infinite;
    }
    .data-stream {
      stroke-dasharray: 6 6;
      animation: dashStream 2s linear infinite;
    }
    .floating-pane {
      transform-origin: 940px 210px;
      animation: floatCard 6s ease-in-out infinite;
    }
    .cursor-blink {
      animation: blinkCursor 1s infinite;
    }
  </style>

  <!-- 1. Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#compilerGrid)"/>

  <!-- 2. Ambient Glow (Right side background behind interactive elements) -->
  <g class="ambient-pulse">
    <circle cx="940" cy="180" r="190" fill="#6366F1" opacity="0.18" filter="url(#glow)"/>
    <circle cx="1060" cy="240" r="140" fill="#38BDF8" opacity="0.16" filter="url(#glow)"/>
    <circle cx="820" cy="120" r="100" fill="#C084FC" opacity="0.12" filter="url(#glow)"/>
  </g>

  <!-- 3. Dynamic Pipeline & Code Execution Visualization (Right Side: 720 to 1140) -->
  <g class="floating-pane">
    <!-- Connector Data Stream Lines (Dynamic Flow) -->
    <path d="M 740 100 L 870 100 L 870 140" fill="none" stroke="#38BDF8" stroke-width="2" class="data-stream" opacity="0.7"/>
    <path d="M 1040 140 L 1040 100 L 1120 100" fill="none" stroke="#818CF8" stroke-width="2" class="data-stream" opacity="0.7"/>
    <path d="M 870 320 L 870 350 L 1040 350 L 1040 320" fill="none" stroke="#C084FC" stroke-width="2" class="data-stream" opacity="0.6"/>

    <!-- Small Pipeline Node Tags -->
    <g transform="translate(720, 80)">
      <rect width="90" height="32" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" opacity="0.9"/>
      <text x="45" y="21" class="mono-font" font-size="11" fill="#38BDF8" font-weight="700" text-anchor="middle">SPEC / PROMPT</text>
    </g>

    <g transform="translate(1040, 80)">
      <rect width="90" height="32" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1.2" opacity="0.9"/>
      <text x="45" y="21" class="mono-font" font-size="11" fill="#34D399" font-weight="700" text-anchor="middle">MERGE PR</text>
    </g>

    <!-- Terminal Code Card (Center-Right Foreground) -->
    <g transform="translate(740, 130)">
      <!-- Card Box -->
      <rect width="390" height="195" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.4" filter="url(#subtleGlow)"/>
      
      <!-- Window Controls -->
      <circle cx="20" cy="18" r="4.5" fill="#EF4444"/>
      <circle cx="36" cy="18" r="4.5" fill="#F59E0B"/>
      <circle cx="52" cy="18" r="4.5" fill="#10B981"/>
      <text x="80" y="22" class="mono-font" font-size="11" fill="#64748B">synthetic-compiler://agent-session</text>
      <line x1="0" y1="34" x2="390" y2="34" stroke="#1E293B" stroke-width="1.2"/>

      <!-- Terminal Body Content -->
      <g transform="translate(18, 56)" class="mono-font" font-size="12">
        <text y="0" fill="#38BDF8"><tspan fill="#F472B6">$</tspan> agent.synthesize(<tspan fill="#FDE047">"build-microservice"</tspan>)</text>
        <text y="24" fill="#94A3B8">↳ Scanning codebase context: <tspan fill="#34D399">1,420 AST nodes</tspan></text>
        <text y="46" fill="#94A3B8">↳ Generating multi-file patch: <tspan fill="#818CF8">8 files written</tspan></text>
        <text y="68" fill="#94A3B8">↳ Sandboxed test harness: <tspan fill="#34D399">PASS (42/42 tests)</tspan></text>
        <text y="90" fill="#34D399" font-weight="700">✓ Ready for production: PR #128 compiled</text>
        <text y="112" fill="#38BDF8">> toolchain ready <tspan fill="#38BDF8" class="cursor-blink">▍</tspan></text>
      </g>
    </g>

    <!-- Bottom Stat Pill -->
    <g transform="translate(790, 345)">
      <rect width="290" height="30" rx="15" fill="#0F172A" stroke="#818CF8" stroke-width="1" opacity="0.95"/>
      <circle cx="16" cy="15" r="4" fill="#34D399"/>
      <text x="30" y="20" class="mono-font" font-size="11" fill="#E2E8F0">Autonomous Compiler Harness: <tspan fill="#38BDF8" font-weight="700">Active</tspan></text>
    </g>
  </g>

  <!-- 4. Foreground Typography & Left Section (Never hidden, x: 70 to 680) -->
  <g transform="translate(70, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 52)">
      <rect width="255" height="28" rx="14" fill="url(#pillGrad)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.6"/>
      <text x="14" y="18" class="mono-font" font-size="11" font-weight="700" fill="#38BDF8">⚡ CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="128" class="sans-font" font-size="40" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.8">
      AWESOME SYNTHETIC CODE
    </text>
    <text x="0" y="172" class="sans-font" font-size="38" font-weight="900" fill="#FFFFFF" letter-spacing="-0.6">
      GENERATION COMPILERS
    </text>

    <!-- Subtitle -->
    <text x="0" y="214" class="sans-font" font-size="15.5" font-weight="500" fill="#94A3B8">
      Autonomous Coding Agents, Software Synthesizers &amp; Native Toolchain Runtimes
    </text>
    <text x="0" y="238" class="sans-font" font-size="13.5" font-weight="400" fill="#64748B">
      From conversational prompts to compiled, tested, merge-ready pull requests
    </text>

    <!-- Feature Tag Badges -->
    <g transform="translate(0, 276)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="138" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="12" y="18" class="sans-font" font-size="12" fill="#E2E8F0">🤖 Coding Agents</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(148, 0)">
        <rect width="144" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="12" y="18" class="sans-font" font-size="12" fill="#E2E8F0">⚡ SWE-Bench SOTA</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(302, 0)">
        <rect width="146" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="12" y="18" class="sans-font" font-size="12" fill="#E2E8F0">🛠️ Sandboxed Build</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(458, 0)">
        <rect width="134" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="12" y="18" class="sans-font" font-size="12" fill="#E2E8F0">🌐 Multi-Model BYOK</text>
      </g>
    </g>

    <!-- Key Metrics / Meta Bar -->
    <g transform="translate(0, 332)">
      <line x1="0" y1="0" x2="590" y2="0" stroke="#1E293B" stroke-width="1"/>
      <text x="0" y="26" class="mono-font" font-size="12" fill="#64748B">
        <tspan fill="#38BDF8">●</tspan> 10 SaaS Leaders   <tspan fill="#818CF8">●</tspan> 20 Open-Source Repos   <tspan fill="#34D399">●</tspan> Continuously Updated
      </text>
    </g>
  </g>
</svg>
